<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Mood Journal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .entry {
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .entry:nth-child(odd) {
      background-color: #fef9e7;
    }

    .entry:nth-child(even) {
      background-color: #e8f8f5;
    }

    .entry::before {
      font-size: 30px;
      position: absolute;
      left: 15px;
      top: 15px;
    }

    .happy::before {
      content: "😀";
    }

    .meh::before {
      content: "😐";
    }

    .sad::before {
      content: "😢";
    }

    .happy:hover::before {
      content: "😄";
    }

    .meh:hover::before {
      content: "🙂";
    }

    .sad:hover::before {
      content: "😭";
    }

    .entry p::first-letter {
      font-size: 200%;
      font-weight: bold;
      color: #0077cc;
    }

    .like-button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease;
    }

    .like-button:active {
      transform: scale(1.2);
    }

    .entry:hover {
      transform: scale(1.02);
    }

    .entry::after {
      content: "✨";
      display: block;
      margin-top: 10px;
      text-align: right;
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>
<body style="background-color: bisque;">
  <h1>🌈 My Mood Journal</h1>

  <div class="entry happy">
    <h2>Feeling Great!</h2>
    <p>Today was awesome. I finished my homework and played outside!</p>
    <button class="like-button">❤️ Like</button>
  </div>

  <div class="entry meh">
    <h2>Just an Average Day</h2>
    <p>Nothing special today. Same old routine with school and dinner.</p>
    <button class="like-button">❤️ Like</button>
  </div>

  <div class="entry sad">
    <h2>A Bit Down</h2>
    <p>Felt a little off today. Missed my friends and stayed indoors.</p>
    <button class="like-button">❤️ Like</button>
  </div>
</body>
</html>
